  <style>
    :root {
      --bg: #f4f1ec;
      --bg-elev: #ffffff;
      --card: #ffffff;
      --card-hover: #faf8f5;
      --line: rgba(28, 25, 23, 0.08);
      --ink: #1c1917;
      --muted: #78716c;
      --gold: #b45309;
      --gold-dim: #c2410c;
      --chili: #e11d48;
      --chili-soft: rgba(225, 29, 72, 0.1);
      --teal: #0f766e;
      --teal-soft: rgba(15, 118, 110, 0.12);
      --danger: #e11d48;
      --danger-soft: rgba(225, 29, 72, 0.1);
      --shadow: 0 10px 30px rgba(28, 25, 23, 0.06);
      --radius: 20px;
      --font: "SF Pro Text", "PingFang TC", "Noto Sans TC", "Helvetica Neue", system-ui, sans-serif;
      --display: "SF Pro Display", "PingFang TC", "Noto Sans TC", "Helvetica Neue", system-ui, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
      --notes: #44403c;
      --shadow-card: 0 8px 24px rgba(28, 25, 23, 0.06);
      --radius-card: 16px;
      --cover-radius: 15px 15px 0 0;
      --fab-bg: #1c1917;
      --fab-color: #fffaf5;
      --fab-shadow: 0 10px 24px rgba(28, 25, 23, 0.22);
      --theme-color: #f4f1ec;
      --card-border: 1px solid rgba(28, 25, 23, 0.06);
      --card-gap: 10px;
      color-scheme: light;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.45;
      min-height: 100%;
    }
    body {
      min-height: 100dvh;
      padding-bottom: calc(148px + var(--safe-bot));
    }
    button, input, select, textarea {
      font-family: inherit;
      font-size: 16px;
      color: inherit;
    }
    button { cursor: pointer; }
    a { color: var(--gold); }

    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: calc(12px + var(--safe-top)) 16px 0;
    }

    header.app-head {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "brand nearby"
        "actions actions";
      align-items: center;
      column-gap: 12px;
      row-gap: 8px;
      margin-bottom: 18px;
    }
    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      min-width: min-content;
      cursor: pointer;
      border-radius: 14px;
      position: relative;
      z-index: 70;
    }
    .brand:focus-visible { outline: 2px solid var(--gold-dim); outline-offset: 4px; }
    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #1a1410 center/cover no-repeat;
      box-shadow: 0 0 0 1px var(--line), var(--shadow);
      flex-shrink: 0;
    }
    .brand h1 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.45rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .brand .sub {
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 1px;
      white-space: nowrap;
    }
    .head-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 1;
      max-width: 100%;
      grid-area: actions;
      justify-content: flex-end;
    }
    .btn-nearby { grid-area: nearby; justify-self: end; }
    @media (min-width: 600px) {
      header.app-head {
        grid-template-columns: 1fr auto auto;
        grid-template-areas: "brand actions nearby";
        align-items: flex-start;
      }
    }
    .ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      min-height: 40px;
    }
    .ghost:active { background: var(--card); color: var(--ink); }

    .hint {
      background: var(--chili-soft);
      border: 1px solid rgba(232, 93, 4, 0.28);
      color: var(--ink);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .hint button {
      margin-left: auto;
      background: none;
      border: 0;
      color: var(--muted);
      padding: 0 4px;
      font-size: 1.1rem;
      line-height: 1;
    }
    .hint[hidden], .install-hint[hidden] { display: none; }

    .search {
      width: 100%;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px 12px 42px;
      outline: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%2378716c' stroke-width='1.8' stroke-linecap='round'><circle cx='9' cy='9' r='6'/><path d='M13.5 13.5 L17 17'/></svg>");
      background-repeat: no-repeat;
      background-position: 14px 50%;
    }
    .search:focus { border-color: var(--gold-dim); }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0 6px;
    }
    .filters label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .filters select {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 28px 10px 10px;
      min-height: 44px;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' fill='%2378716c'><path d='M0 0l6 8 6-8z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
    }

    .count {
      color: var(--muted);
      font-size: 0.8rem;
      margin: 8px 2px 12px;
    }

    .list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--card-gap);
    }
    .list .empty { grid-column: 1 / -1; }
    @media (min-width: 600px) {
      .filters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 660px) {
      .filters { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .card {
      background: var(--card);
      border: var(--card-border);
      border-radius: var(--radius-card);
      padding: 0 0 10px;
      box-shadow: var(--shadow-card);
      display: block;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      min-width: 0;
      cursor: pointer;
      text-align: left;
      width: 100%;
    }
    .card:active { background: var(--card-hover); }
    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 4px;
    }
    .card h2 {
      margin: 0;
      font-size: 0.88rem;
      font-weight: 650;
      letter-spacing: 0.01em;
      flex: 1;
      min-width: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }
    .badge {
      flex-shrink: 0;
      font-size: 0.62rem;
      font-weight: 650;
      border-radius: 999px;
      padding: 2px 6px;
      letter-spacing: 0.02em;
      line-height: 1.3;
    }
    .badge.want { background: rgba(225, 29, 72, 0.1); color: #be123c; }
    .badge.been { background: rgba(15, 118, 110, 0.12); color: #0f766e; }
    .badge.rec { background: rgba(180, 83, 9, 0.12); color: #b45309; }
    .badge.bib { background: rgba(180, 83, 9, 0.12); color: #b45309; }
    .badge.star { background: rgba(225, 29, 72, 0.1); color: #be123c; }
    .card-badges { display: flex; flex-wrap: wrap; gap: 3px; justify-content: flex-end; max-width: 46%; }
    .meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.72rem;
      display: flex;
      flex-wrap: nowrap;
      gap: 4px;
      min-width: 0;
    }
    .meta span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .price { color: var(--gold); font-weight: 600; letter-spacing: 0.04em; }
    .stars { color: var(--gold); letter-spacing: 0.04em; font-size: 0.7rem; }
    .stars .off { opacity: 0.28; }
    .snippet {
      margin-top: 4px;
      font-size: 0.72rem;
      color: var(--notes);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
    }
    .card-body { padding: 8px 8px 0; }
    .notes, .dishes { color: var(--notes); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 48px 12px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }
    .empty strong { color: var(--ink); display: block; margin-bottom: 6px; font-size: 1.05rem; }

    .fab {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: calc(20px + var(--safe-bot));
      background: var(--chili);
      color: #fff8f0;
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
      box-shadow: 0 10px 24px rgba(232, 93, 4, 0.4);
      z-index: 20;
    }
    .fab:active { transform: translateY(1px); }

    .sheet-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 40;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-bg[hidden] { display: none; }
    .sheet {
      background: var(--bg-elev);
      width: 100%;
      max-width: 560px;
      max-height: min(92dvh, 820px);
      overflow: auto;
      border-radius: 24px 24px 0 0;
      padding: 10px 16px calc(20px + var(--safe-bot));
      box-shadow: var(--shadow);
    }
    .grab {
      width: 40px;
      height: 4px;
      border-radius: 4px;
      background: var(--line);
      margin: 4px auto 10px;
    }
    .sheet h3 {
      margin: 0 0 14px;
      font-family: var(--display);
      font-size: 1.25rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .field span {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .field input, .field select, .field textarea {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      outline: none;
      width: 100%;
    }
    .field textarea { min-height: 88px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold-dim);
    }
    .seg, .mich-seg, .rate-seg {
      display: grid;
      gap: 6px;
    }
    .seg { grid-template-columns: 1fr 1fr 1fr; }
    .mich-seg { grid-template-columns: repeat(5, 1fr); }
    .rate-seg { grid-template-columns: 1.15fr repeat(5, 1fr); }
    .seg button, .mich-seg button, .rate-seg button {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 6px;
      min-height: 44px;
      color: var(--muted);
    }
    .mich-seg button, .rate-seg button { padding: 10px 4px; font-size: 0.78rem; }
    .seg button[aria-pressed="true"].want {
      background: var(--chili-soft);
      border-color: var(--chili);
      color: #ffb347;
    }
    .seg button[aria-pressed="true"].been {
      background: var(--teal-soft);
      border-color: var(--teal);
      color: #7dd3c7;
    }
    .seg button[aria-pressed="true"].rec {
      background: rgba(233, 196, 106, 0.16);
      border-color: var(--gold);
      color: var(--gold);
    }
    .mich-seg button[aria-pressed="true"],
    .rate-seg button[aria-pressed="true"] {
      background: rgba(233, 196, 106, 0.16);
      border-color: var(--gold);
      color: var(--gold);
    }
    .range-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
    }
    .range-row .sep { color: var(--muted); }
    .range-row input { min-width: 0; }
    .badge.bib { background: rgba(233, 196, 106, 0.18); color: #e9c46a; }
    .badge.star { background: rgba(232, 93, 4, 0.16); color: #ffb347; }
    .card-badges { display: flex; flex-wrap: wrap; gap: 6px; flex-shrink: 0; justify-content: flex-end; }
    .dishes {
      margin-top: 8px;
      font-size: 0.86rem;
      color: #e4d7c5;
    }
    .dishes .lbl { color: var(--gold-dim); font-size: 0.72rem; letter-spacing: 0.04em; margin-right: 4px; }
    input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      outline: none;
      width: 100%;
      min-height: 44px;
    }
    input[type="number"]:focus { border-color: var(--gold-dim); }
    .budget-field input { margin-top: 4px; }
    .sheet-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .sheet-actions button {
      flex: 1;
      min-height: 48px;
      border-radius: 14px;
      border: 0;
      font-weight: 650;
    }
    .sheet-actions .cancel {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .sheet-actions .save {
      background: var(--fab-bg);
      color: var(--fab-color);
    }
    .sheet-extra {
      display: flex;
      gap: 8px;
      margin: 0 0 10px;
    }
    .sheet-extra[hidden] { display: none; }
    .sheet-extra button {
      flex: 1;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font-weight: 650;
    }
    .sheet-extra .del { color: var(--danger); border-color: var(--danger-soft); }
    .err { color: var(--danger); font-size: 0.82rem; min-height: 1.2em; margin: 0 0 8px; }

    .confirm {
      text-align: center;
      padding: 8px 8px 4px;
    }
    .confirm p { margin: 0 0 16px; color: var(--ink); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(88px + var(--safe-bot));
      transform: translateX(-50%);
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-card);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.88rem;
      z-index: 60;
      box-shadow: var(--shadow);
      max-width: calc(100% - 32px);
      text-align: center;
    }
    .toast[hidden] { display: none; }

    @media (min-width: 640px) {
      .sheet-bg { align-items: center; padding: 24px; }
      .sheet { border-radius: 24px; }
    }
  
    .cover {
      position: relative;
      aspect-ratio: 16 / 9;
      width: 100%;
      overflow: hidden;
      border-radius: var(--cover-radius);
      background: linear-gradient(135deg, #3f2a1d, #1a1410);
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
    }
    .cover-emoji {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      line-height: 1;
      z-index: 0;
    }
    .cover.is-fallback img { display: none; }
    .cover.is-fallback .cover-emoji { display: flex; }
    .cover-thai { background: linear-gradient(135deg, #9a3412, #f59e0b); }
    .cover-seafood { background: linear-gradient(135deg, #0e7490, #67e8f9); }
    .cover-street { background: linear-gradient(135deg, #b45309, #fbbf24); }
    .cover-japanese { background: linear-gradient(135deg, #1e3a5f, #fb7185); }
    .cover-korean { background: linear-gradient(135deg, #9f1239, #fb7185); }
    .cover-chinese { background: linear-gradient(135deg, #7f1d1d, #f59e0b); }
    .cover-western { background: linear-gradient(135deg, #9a3412, #fdba74); }
    .cover-cafe { background: linear-gradient(135deg, #44403c, #d6b08a); }
    .cover-hotpot { background: linear-gradient(135deg, #7c2d12, #ef4444); }
    .cover-bbq { background: linear-gradient(135deg, #1c1917, #b45309); }
    .cover-fine { background: linear-gradient(135deg, #1e1b4b, #c4b5fd); }
    .cover-default { background: linear-gradient(135deg, #365314, #fbbf24); }
    .form-cover { margin: 0 0 14px; }
    .form-cover .cover { border-radius: 14px; }

    .notes, .dishes { color: var(--notes); }

    
    .filters label, .filters select, .filters input, .budget-field {
      min-width: 0;
      max-width: 100%;
    }
    .filters select, .filters input { width: 100%; }

    .fab {
      background: var(--fab-bg);
      color: var(--fab-color);
      box-shadow: var(--fab-shadow);
    }

    .head-actions { flex-wrap: wrap; justify-content: flex-end; }

    .pager {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 16px 0 calc(96px + var(--safe-bot));
    }
    @media (min-width: 600px) {
      /* Keep 下一頁 clear of the fixed 新增餐廳 button on Fold landscape. */
      .pager {
        padding-right: calc(140px + env(safe-area-inset-right));
        box-sizing: border-box;
      }
    }
    .pager[hidden] { display: none; }
    .pager button {
      min-width: 36px;
      min-height: 36px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font-weight: 650;
      font-size: 0.82rem;
    }
    .pager button.nav { padding: 0 12px; }
    .pager button[aria-current="page"] {
      background: #1c1917;
      border-color: #1c1917;
      color: #fffaf5;
    }
    .pager button:disabled {
      opacity: 0.38;
      cursor: default;
    }
    .pager .ellipsis {
      color: var(--muted);
      min-width: 20px;
      text-align: center;
      font-size: 0.82rem;
    }

    .card-maps {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 0;
      background: rgba(255, 250, 245, 0.94);
      box-shadow: 0 2px 8px rgba(28, 25, 23, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
      padding: 0;
      color: var(--ink);
      touch-action: manipulation;
    }
    .card-maps:active { transform: scale(0.94); }

    .list-viewport {
      overflow: hidden;
      overscroll-behavior-x: none;
    }
    .list {
      touch-action: pan-y;
    }
    .list.is-animating { transition: transform 0.22s ease; }
    .list.is-swiping { transition: none; }

    #confirmSheet { z-index: 50; }

    .detail-bg {
      z-index: 30;
      align-items: center;
      padding: 16px;
      padding-top: max(16px, var(--safe-top));
      padding-bottom: max(16px, var(--safe-bot));
      background: rgba(28, 25, 23, 0.5);
      overflow: auto;
    }
    .detail-bg[hidden] { display: none; }
    .detail-card {
      background: var(--card);
      width: 100%;
      max-width: 520px;
      max-height: min(92dvh, 860px);
      overflow: auto;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(28, 25, 23, 0.22);
      transform: scale(0.94) translateY(16px);
      opacity: 0.7;
      transition: transform 0.22s ease, opacity 0.22s ease;
      border: var(--card-border);
    }
    .detail-bg.is-open .detail-card {
      transform: scale(1) translateY(0);
      opacity: 1;
    }
    .detail-cover .cover {
      aspect-ratio: 16 / 10;
      border-radius: 20px 20px 0 0;
    }
    .detail-body { padding: 14px 16px 18px; }
    .detail-body h2 {
      margin: 0;
      font-size: 1.22rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      flex: 1;
      min-width: 0;
      line-height: 1.3;
    }
    .detail-meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.86rem;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
    }
    .detail-fields { margin: 14px 0 0; }
    .detail-row { margin: 0 0 12px; }
    .detail-row .lbl {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }
    .detail-row .val {
      font-size: 0.95rem;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .detail-actions button {
      min-height: 48px;
      border-radius: 14px;
      font-weight: 650;
      border: 0;
      white-space: nowrap;
      padding: 0 12px;
    }
    .detail-actions .maps { grid-column: 1 / -1; }
    .detail-actions .maps {
      background: var(--fab-bg);
      color: var(--fab-color);
    }
    .detail-actions .edit {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
    }
    .detail-actions .close {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .detail-actions .been {
      background: transparent;
      border: 1px solid var(--line);
      color: #0f766e;
    }
    .detail-actions .been[aria-pressed="true"],
    .detail-actions .been:disabled {
      background: var(--teal-soft);
      border-color: var(--teal);
      color: #0f766e;
      opacity: 1;
      cursor: default;
    }
    .detail-actions .revisit {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
    }
    .detail-actions .revisit[aria-pressed="true"] {
      background: rgba(180, 83, 9, 0.12);
      border-color: var(--gold);
      color: #b45309;
    }
    .badge.revisit-flag {
      background: rgba(180, 83, 9, 0.12);
      color: #b45309;
      padding: 2px 5px;
      letter-spacing: 0;
    }
    .g-rating {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 2;
      background: rgba(28, 25, 23, 0.84);
      color: #fffaf5;
      font-size: 0.68rem;
      font-weight: 650;
      border-radius: 999px;
      padding: 2px 7px;
      letter-spacing: 0.02em;
      line-height: 1.3;
      pointer-events: none;
    }
    .g-rating-inline {
      position: static;
      display: inline-block;
      background: rgba(28, 25, 23, 0.08);
      color: var(--ink);
      font-size: 0.82rem;
      padding: 2px 8px;
      pointer-events: auto;
    }
    body.detail-open { overflow: hidden; }
    body.detail-open .fab { visibility: hidden; }

    .btn-nearby {
      background: var(--gold);
      color: #1a1208;
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      min-height: 40px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-nearby:active { filter: brightness(0.95); }
    .btn-nearby:disabled { opacity: 0.6; }
    .nearby-bg {
      z-index: 25;
      align-items: flex-end;
      padding: 0;
      background: rgba(28, 25, 23, 0.5);
    }
    .nearby-card {
      background: var(--card);
      width: 100%;
      max-width: 560px;
      max-height: min(88dvh, 820px);
      overflow: auto;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 20px 50px rgba(28, 25, 23, 0.22);
      border: var(--card-border);
      padding: 16px 16px max(16px, var(--safe-bot));
    }
    .nearby-head {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }
    .nearby-head h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.2rem;
      font-weight: 650;
    }
    .nearby-note {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
      background: var(--chili-soft);
      border: 1px solid rgba(232, 93, 4, 0.28);
      border-radius: 10px;
      padding: 8px 10px;
    }
    .nearby-loading, .nearby-empty {
      margin: 18px 0;
      text-align: center;
      color: var(--muted);
    }
    .nearby-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .nearby-list .card { cursor: pointer; }
    .nearby-dist {
      position: absolute;
      right: 8px;
      bottom: 8px;
      z-index: 2;
      background: rgba(28, 25, 23, 0.84);
      color: #fffaf5;
      font-size: 0.68rem;
      font-weight: 650;
      border-radius: 999px;
      padding: 2px 7px;
      letter-spacing: 0.02em;
      line-height: 1.3;
      pointer-events: none;
    }
    .nearby-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }
    .nearby-actions .primary {
      background: var(--gold);
      color: #1a1208;
      border: 0;
      border-radius: 999px;
      min-height: 44px;
      font-weight: 700;
    }
    .nearby-actions .ghost { width: 100%; }
    body.nearby-open { overflow: hidden; }
    body.nearby-open .fab { visibility: hidden; }
    @media (min-width: 600px) {
      .nearby-bg { align-items: center; padding: 16px; }
      .nearby-card { border-radius: 20px; }
    }

  </style>
</head>
<body>
  <div class="wrap">
    <header class="app-head">
      <div class="brand" id="btnHome" role="button" tabindex="0" aria-label="回到首頁">
        <div class="logo" id="appLogo" role="img" aria-label="美食獵人"></div>
        <div>
          <h1>美食獵人</h1>
          <div class="sub">曼谷口袋名單</div>
        </div>
      </div>
      <div class="head-actions">
        <button type="button" class="ghost" id="btnExport">匯出</button>
        <button type="button" class="ghost" id="btnImport">匯入</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <button type="button" class="btn-nearby" id="btnNearby">🎲 附近推薦</button>
    </header>

    <div class="hint install-hint" id="installHint" hidden>
      <div>用 Safari 或 Chrome 打開後，點「分享／選單」再選「加入主畫面」，就可以當 App 使用，離線也能看名單。</div>
      <button type="button" id="dismissInstall" aria-label="關閉">×</button>
    </div>

    <input class="search" id="search" type="search" placeholder="搜尋店名、區域、料理、推薦菜或筆記" enterkeyhint="search" autocomplete="off">

    <div class="filters">
      <label>區域
        <select id="filterArea"></select>
      </label>
      <label>料理
        <select id="filterCuisine"></select>
      </label>
      <label>狀態
        <select id="filterStatus">
          <option value="">全部狀態</option>
          <option value="想去">想去</option>
          <option value="去過">去過</option>
          <option value="推薦">推薦</option>
        </select>
      </label>
      <label>米其林／必比登
        <select id="filterMichelin">
          <option value="">全部</option>
          <option value="必比登或星級">必比登或星級</option>
          <option value="必比登">必比登</option>
          <option value="米其林一星">米其林一星</option>
          <option value="二星">二星</option>
          <option value="三星">三星</option>
          <option value="無">無</option>
        </select>
      </label>
      <label>排序
        <select id="sortBy">
          <option value="newest">最新</option>
          <option value="rating">評分</option>
          <option value="price">人均</option>
        </select>
      </label>
      <label class="budget-field">人均預算上限（泰銖）
        <input id="filterBudget" type="number" min="0" step="50" inputmode="numeric" placeholder="不限">
      </label>
      <label>還會回去
        <select id="filterRevisit">
          <option value="">全部</option>
          <option value="1">還會回去</option>
        </select>
      </label>
    </div>

    <div class="count" id="count"></div>
    <div class="list-viewport" id="listViewport">
      <div class="list" id="list"></div>
    </div>
    <nav class="pager" id="pager" hidden aria-label="分頁"></nav>
  </div>

  <button type="button" class="fab" id="btnAdd">＋ 新增餐廳</button>
  <div class="toast" id="toast" hidden></div>

  <div class="sheet-bg" id="formSheet" hidden>
    <form class="sheet" id="restoForm" autocomplete="off">
      <div class="grab"></div>
      <div class="form-cover" id="formCover"></div>
      <h3 id="formTitle">新增餐廳</h3>
      <input type="hidden" id="editId">
      <label class="field">店名
        <input id="fName" name="name" required maxlength="120" placeholder="例如 Krua Apsorn">
      </label>
      <label class="field">區域
        <input id="fArea" name="area" maxlength="80" placeholder="例如 Thonglor" list="areaList">
      </label>
      <datalist id="areaList"></datalist>
      <label class="field">料理類型
        <input id="fCuisine" name="cuisine" maxlength="80" placeholder="例如 南泰料理" list="cuisineList">
      </label>
      <datalist id="cuisineList"></datalist>
      <label class="field">推薦菜
        <textarea id="fDishes" name="dishes" maxlength="400" placeholder="例如 蝦餃、腸粉、流沙包"></textarea>
      </label>
      <div class="field"><span>米其林</span>
        <div class="mich-seg" id="michSeg"></div>
      </div>
      <div class="field"><span>人均（泰銖）</span>
        <div class="range-row">
          <input id="fPriceMin" type="number" min="0" step="10" inputmode="numeric" placeholder="最低">
          <span class="sep">–</span>
          <input id="fPriceMax" type="number" min="0" step="10" inputmode="numeric" placeholder="最高">
        </div>
      </div>
      <div class="field"><span>狀態</span>
        <div class="seg" id="statusSeg">
          <button type="button" class="want" data-status="想去" aria-pressed="true">想去</button>
          <button type="button" class="been" data-status="去過" aria-pressed="false">去過</button>
          <button type="button" class="rec" data-status="推薦" aria-pressed="false">推薦</button>
        </div>
      </div>
      <div class="field"><span>我的評分</span>
        <div class="rate-seg" id="rateSeg"></div>
      </div>
      <label class="field">Google Maps 連結
        <input id="fMaps" name="maps" maxlength="500" placeholder="沒填會自動用店名搜尋曼谷" inputmode="url">
      </label>
      <label class="field">筆記
        <textarea id="fNotes" name="notes" maxlength="800" placeholder="訂位、營業時間、心得…"></textarea>
      </label>
      <p class="err" id="formErr"></p>
      <div class="sheet-extra" id="formExtra" hidden>
        <button type="button" class="maps-btn" id="btnOpenMaps">開啟地圖</button>
        <button type="button" class="del" id="btnFormDelete">刪除這家餐廳</button>
      </div>
      <div class="sheet-actions">
        <button type="button" class="cancel" id="btnCancel">取消</button>
        <button type="submit" class="save">儲存</button>
      </div>
    </form>
  </div>

  <div class="sheet-bg" id="confirmSheet" hidden>
    <div class="sheet confirm" role="dialog" aria-labelledby="confirmTitle">
      <div class="grab"></div>
      <h3 id="confirmTitle">刪除這家餐廳？</h3>
      <p id="confirmMsg"></p>
      <div class="sheet-actions">
        <button type="button" class="cancel" id="btnConfirmNo">取消</button>
        <button type="button" class="save" id="btnConfirmYes" style="background:#c2410c">刪除</button>
      </div>
    </div>
  </div>

  <div class="sheet-bg detail-bg" id="detailSheet" hidden>
    <article class="detail-card" id="detailCard" role="dialog" aria-modal="true" aria-labelledby="detailName">
      <div class="detail-cover" id="detailCover"></div>
      <div class="detail-body">
        <div class="card-top">
          <h2 id="detailName"></h2>
          <div class="card-badges" id="detailBadges"></div>
        </div>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-fields" id="detailFields"></div>
        <div class="detail-actions">
          <button type="button" class="maps" id="btnDetailMaps">開 Google Maps</button>
          <button type="button" class="been" id="btnDetailBeen">已去過</button>
          <button type="button" class="revisit" id="btnDetailRevisit" aria-pressed="false">還會回去</button>
          <button type="button" class="edit" id="btnDetailEdit">編輯</button>
          <button type="button" class="close" id="btnDetailClose">關閉</button>
        </div>
      </div>
    </article>
  </div>

  <div class="sheet-bg nearby-bg" id="nearbySheet" hidden>
    <div class="nearby-card" id="nearbyCard" role="dialog" aria-modal="true" aria-labelledby="nearbyTitle">
      <div class="nearby-head">
        <h2 id="nearbyTitle">附近推薦</h2>

      fillSelect($("filterArea"), uniqueSorted(state.items.map(function (r) { return r.area; })), "全部區域", area);
      fillSelect($("filterCuisine"), uniqueSorted(state.items.map(function (r) { return r.cuisine; })), "全部料理", cuisine);
      $("areaList").innerHTML = uniqueSorted(state.items.map(function (r) { return r.area; })).map(function (v) {
        return '<option value="' + escapeHtml(v) + '">';
      }).join("");
      $("cuisineList").innerHTML = uniqueSorted(state.items.map(function (r) { return r.cuisine; })).map(function (v) {
        return '<option value="' + escapeHtml(v) + '">';
      }).join("");
    }

    function starHtml(rating) {
      if (!rating) return "";
      var s = "";
      for (var i = 1; i <= 5; i++) s += '<span class="' + (i <= rating ? "" : "off") + '">★</span>';
      return '<span class="stars" aria-label="評分 ' + rating + ' 分">' + s + "</span>";
    }

    function revisitBadgeHtml(item) {
      if (!item || !item.revisit) return "";
      return '<span class="badge revisit-flag" title="還會回去" aria-label="還會回去">🔁</span>';
    }


    var COVERS = {
      thai:     { id: "thai",     src: "img/thai.webp",     emoji: "🍛", label: "泰菜" },
      seafood:  { id: "seafood",  src: "img/seafood.webp",  emoji: "🦐", label: "海鮮" },
      street:   { id: "street",   src: "img/street.webp",   emoji: "🍜", label: "街頭小吃/麵" },
      japanese: { id: "japanese", src: "img/japanese.webp", emoji: "🍣", label: "日本料理" },
      korean:   { id: "korean",   src: "img/korean.webp",   emoji: "🍲", label: "韓式" },
      chinese:  { id: "chinese",  src: "img/chinese.webp",  emoji: "🥟", label: "中菜" },
      western:  { id: "western",  src: "img/western.webp",  emoji: "🍝", label: "西餐/義式/法式" },
      cafe:     { id: "cafe",     src: "img/cafe.webp",     emoji: "☕", label: "咖啡/甜點" },
      hotpot:   { id: "hotpot",   src: "img/hotpot.webp",   emoji: "🫕", label: "火鍋/涮涮鍋" },
      bbq:      { id: "bbq",      src: "img/bbq.webp",      emoji: "🔥", label: "燒肉/BBQ" },
      fine:     { id: "fine",     src: "img/fine.webp",     emoji: "🍽️", label: "精緻料理" },
      def:      { id: "default",  src: "img/default.webp",  emoji: "🍴", label: "美食" }
    };

    function coverFor(cuisine) {
      var c = String(cuisine || "");
      if (/火鍋|涮涮鍋|shabu|hot\s*pot/i.test(c)) return COVERS.hotpot;
      if (/燒肉|BBQ|烧烤|燒烤|yakiniku/i.test(c)) return COVERS.bbq;
      if (/精緻|當代泰菜|中法精緻|fine\s*dining|omakase/i.test(c)) return COVERS.fine;
      if (/海鮮|seafood/i.test(c)) return COVERS.seafood;
      if (/韓|korean/i.test(c)) return COVERS.korean;
      if (/日式|日本|和牛|居酒屋|sushi|ramen/i.test(c)) return COVERS.japanese;
      if (/中菜|上海|潮州|港式|粵|dim\s*sum/i.test(c)) return COVERS.chinese;
      if (/街頭|粥|鮮米粉|牛肉麵|越南|street/i.test(c)) return COVERS.street;
      if (/咖啡|甜點|cafe|dessert/i.test(c)) return COVERS.cafe;
      if (/泰/.test(c) || /thai/i.test(c)) return COVERS.thai;
      if (/西式|義式|法式|漢堡|burger|diner|牛排|地中海|Gordon|bistro|小酒館|披薩|pizza|western|pasta/i.test(c)) return COVERS.western;
      return COVERS.def;
    }

    function coverForItem(r) {
      var base = coverFor(r && r.cuisine);
      if (r && r.photo) {
        return { id: base.id, src: r.photo, emoji: base.emoji, photo: true };
      }
      return base;
    }

    function coverHtml(cover, extra) {
      cover = cover || COVERS.def;
      return (
        '<div class="cover cover-' + cover.id + (cover.photo ? " has-photo" : "") + '" data-cat="' + cover.id + '"' +
          (cover.photo ? ' data-photo="1"' : "") + ">" +
          '<img src="' + cover.src + '" alt="" width="600" height="338" loading="lazy" decoding="async" onerror="window.__foodCoverError(this)">' +
          '<span class="cover-emoji" aria-hidden="true">' + cover.emoji + "</span>" +
          (extra || "") +
        "</div>"
      );
    }

    window.__foodCoverError = function (img) {
      var box = img && img.parentNode;
      if (box && box.classList) box.classList.add("is-fallback");
    };

    function refreshFormCover() {
      var el = $("formCover");
      if (!el) return;
      var id = $("editId") ? $("editId").value : "";
      var item = null;
      if (id && state.items) {
        for (var i = 0; i < state.items.length; i++) {
          if (state.items[i].id === id) { item = state.items[i]; break; }
        }
      }
      el.innerHTML = coverHtml(item && item.photo ? coverForItem(item) : coverFor($("fCuisine").value));
    }

    function currentPageSize() {
      var w = window.innerWidth || 0;
      if (w >= 660) return 8;
      return 6;
    }

    function layoutCols() {
      var w = window.innerWidth || 0;
      if (w >= 660) return 4;
      if (w >= 600) return 3;
      return 2;
    }

    function pageCount(n) {
      return Math.max(1, Math.ceil((n || 0) / currentPageSize()));
    }

    function clampPage(nItems) {
      var max = nItems ? pageCount(nItems) : 1;
      if (state.page < 1) state.page = 1;
      if (state.page > max) state.page = max;
    }

    function pageNumbers(cur, total) {
      if (total <= 7) {
        var all = [];
        for (var i = 1; i <= total; i++) all.push(i);
        return all;
      }
      var pages = [];
      var start, end;
      if (cur <= 3) { start = 1; end = 3; }
      else if (cur >= total - 2) { start = total - 2; end = total; }
      else { start = cur - 1; end = cur + 1; }
      if (start > 1) {
        pages.push(1);
        if (start > 2) pages.push("…");
      }
      for (var p = start; p <= end; p++) pages.push(p);
      if (end < total) {
        if (end < total - 1) pages.push("…");
        pages.push(total);
      }
      return pages;
    }

    function renderPager(visible, totalPages) {
      var nav = $("pager");
      if (!nav) return;
      if (visible < 1) {
        nav.hidden = true;
        nav.innerHTML = "";
        return;
      }
      nav.hidden = false;
      var cur = state.page;
      var html = '<button type="button" class="nav" data-page="prev" ' + (cur <= 1 ? "disabled" : "") + ">上一頁</button>";
      pageNumbers(cur, totalPages).forEach(function (p) {
        if (p === "…") {
          html += '<span class="ellipsis" aria-hidden="true">…</span>';
        } else {
          html += '<button type="button" data-page="' + p + '"' +
            (p === cur ? ' aria-current="page"' : "") + ">" + p + "</button>";
        }
      });
      html += '<button type="button" class="nav" data-page="next" ' + (cur >= totalPages ? "disabled" : "") + ">下一頁</button>";
      nav.innerHTML = html;
    }

    function goToPage(n, scroll) {
      state.page = n;
      render();
      if (scroll) {
        var top = $("count") || $("list");
        if (top && top.scrollIntoView) top.scrollIntoView({ block: "start" });
      }
    }

    function onFilterChange() {
      state.page = 1;
      render();
    }

    function render() {
      var list = filteredItems();
      var total = state.items.length;
      clampPage(list.length);
      var totalPages = list.length ? pageCount(list.length) : 1;
      var size = currentPageSize();
      PAGE_SIZE = size;
      lastPageSize = size;
      var start = (state.page - 1) * size;
      var pageItems = list.slice(start, start + size);
      var prefix = list.length === total
        ? "共 " + total + " 家"
        : "顯示 " + list.length + " / " + total + " 家";
      $("count").textContent = prefix + " · 第 " + state.page + "/" + totalPages + " 頁";

      if (!total) {
        $("list").innerHTML = '<div class="empty"><strong>還沒有任何餐廳</strong>點右下角「新增餐廳」，填店名後就能存進這支手機。也可以先匯入之前備份的 JSON。</div>';
        renderPager(0, 1);
        return;
      }
      if (!list.length) {
        $("list").innerHTML = '<div class="empty"><strong>沒有符合的餐廳</strong>改一下搜尋或篩選條件試試看。</div>';
        renderPager(0, 1);
        return;
      }

      $("list").innerHTML = pageItems.map(function (r) {
        var badge = r.status === "去過" ? "been" : (r.status === "推薦" ? "rec" : "want");
        var mich = "";
        if (r.michelin && r.michelin !== "無") {
          var cls = r.michelin === "必比登" ? "bib" : "star";
          mich = '<span class="badge ' + cls + '">' + escapeHtml(r.michelin) + "</span>";
        }
        var baht = formatBahtRange(r.priceMin, r.priceMax);
        var cover = coverForItem(r);
        var bits = [];
        if (r.cuisine) bits.push(r.cuisine);
        if (baht) bits.push(baht);
        var snippet = r.notes || bits.join(" · ");
        return (
          '<article class="card" data-id="' + escapeHtml(r.id) + '" tabindex="0" role="button">' +
            coverHtml(cover, gRatingBadgeHtml(r)) +
            '<button type="button" class="card-maps" data-maps="1" aria-label="開 Google Maps" onclick="event.stopPropagation()">📍</button>' +
            '<div class="card-body">' +
            '<div class="card-top">' +
              "<h2>" + escapeHtml(r.name) + "</h2>" +
              '<div class="card-badges">' +
                mich +
                revisitBadgeHtml(r) +
                '<span class="badge ' + badge + '">' + escapeHtml(r.status) + "</span>" +
              "</div>" +
            "</div>" +
            '<div class="meta">' +
              (r.area ? "<span>" + escapeHtml(r.area) + "</span>" : "") +
              starHtml(r.rating) +
            "</div>" +
            (snippet ? '<div class="snippet">' + escapeHtml(snippet) + "</div>" : "") +
            "</div>" +
          "</article>"
        );
      }).join("");
      renderPager(list.length, totalPages);
    }

    function toast(msg) {
      var el = $("toast");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.hidden = true; }, 2200);
    }

      $("editId").value = item ? item.id : "";
      $("fName").value = item ? item.name : "";
      $("fArea").value = item ? item.area : "";
      $("fCuisine").value = item ? item.cuisine : "";
      $("fDishes").value = item ? item.dishes : "";
      $("fPriceMin").value = item && item.priceMin != null ? item.priceMin : "";
      $("fPriceMax").value = item && item.priceMax != null ? item.priceMax : "";
      $("fMaps").value = item ? item.maps : "";
      $("fNotes").value = item ? item.notes : "";

    function renderDetail(item) {
      if (!item) return;
      $("detailCover").innerHTML = coverHtml(coverForItem(item), gRatingBadgeHtml(item));
      $("detailName").textContent = item.name || "";
      var badge = item.status === "去過" ? "been" : (item.status === "推薦" ? "rec" : "want");
      var badges = "";

        var cls = item.michelin === "必比登" ? "bib" : "star";
        badges += '<span class="badge ' + cls + '">' + escapeHtml(item.michelin) + "</span>";

      var rows = [];

    function syncDetailActions(item) {

      }
    }

    function markBeen() {
      var item = findItem(state.detailId);

    }

    function toggleRevisit() {
      var item = findItem(state.detailId);
      if (!item) return;
      var on = !item.revisit;
      upsertItem(normalizeItem(Object.assign({}, item, { revisit: on })));

    function openDetail(item) {
      if (!item) return;
      state.detailId = item.id;
      renderDetail(item);
      var sheet = $("detailSheet");
      sheet.hidden = false;
      document.body.classList.add("detail-open");
      requestAnimationFrame(function () { sheet.classList.add("is-open"); });
      if (!state.detailPushed) {
        try {
          history.pushState({ fhDetail: item.id }, "");
          state.detailPushed = true;
        } catch (err) {}
      }
    }

    function closeDetail(fromPop) {
      var sheet = $("detailSheet");
      if (!sheet || sheet.hidden) {
        state.detailId = null;
        document.body.classList.remove("detail-open");
        return;
      }
      sheet.classList.remove("is-open");
      sheet.hidden = true;
      document.body.classList.remove("detail-open");
      state.detailId = null;
      if (state.detailPushed && !fromPop) {
        state.detailPushed = false;
        try { history.back(); } catch (err) {}
      } else {
        state.detailPushed = false;
      }
    }

    function refreshOpenDetail() {
      if (!state.detailId) return;
      var item = findItem(state.detailId);
      if (item) renderDetail(item);
      else closeDetail();
    }

    var swipeState = {
      active: false,
      startX: 0,
      startY: 0,
      dx: 0,
      dy: 0,
      decided: null,
      pointerId: null,
      suppressClick: false,
      animating: false
    };
    var swipeTimer = null;
    var SWIPE_THRESHOLD = 50;

    function listWidth() {
      var el = $("listViewport") || $("list");
      return (el && el.getBoundingClientRect().width) || window.innerWidth || 1;
    }

    function animatePageChange(dir) {
      var list = $("list");
      var width = listWidth();
      var dest = state.page + dir;
      swipeState.animating = true;
      list.classList.remove("is-swiping");
      list.classList.add("is-animating");
      list.style.transform = "translateX(" + (-dir * width) + "px)";
      clearTimeout(swipeTimer);
      swipeTimer = setTimeout(function () {
        list.classList.remove("is-animating");
        list.style.transition = "none";
        list.style.transform = "translateX(" + (dir * width) + "px)";
        goToPage(dest, false);
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            list.style.transition = "";
            list.classList.add("is-animating");
            list.style.transform = "translateX(0)";
            clearTimeout(swipeTimer);
            swipeTimer = setTimeout(function () {
              list.classList.remove("is-animating");
              list.style.transform = "";
              swipeState.animating = false;
            }, 230);
          });
        });
      }, 200);
    }

    function onSwipePointerDown(e) {
      if (swipeState.animating) return;
      if (e.isPrimary === false) return;
      if (e.pointerType === "mouse" && e.button !== 0) return;
      if (e.target && e.target.closest && e.target.closest(".card-maps")) return;
      var list = $("list");
      if (!list.contains(e.target)) return;
      swipeState.active = true;
      swipeState.startX = e.clientX;
      swipeState.startY = e.clientY;
      swipeState.dx = 0;
      swipeState.dy = 0;
      swipeState.decided = null;
      swipeState.pointerId = e.pointerId;
    }

    function onSwipePointerMove(e) {
      if (!swipeState.active || e.pointerId !== swipeState.pointerId) return;
      swipeState.dx = e.clientX - swipeState.startX;
      swipeState.dy = e.clientY - swipeState.startY;
      if (!swipeState.decided) {
        if (Math.abs(swipeState.dx) < 8 && Math.abs(swipeState.dy) < 8) return;
        if (Math.abs(swipeState.dx) > Math.abs(swipeState.dy)) {
          swipeState.decided = "h";
          $("list").classList.add("is-swiping");
          try { $("list").setPointerCapture(e.pointerId); } catch (err) {}
        } else {
          swipeState.decided = "v";
        }
      }
      if (swipeState.decided === "h") {
        if (e.cancelable) e.preventDefault();
        var dx = swipeState.dx;
        var max = pageCount(filteredItems().length);
        if ((state.page <= 1 && dx > 0) || (state.page >= max && dx < 0)) dx = dx * 0.28;
        $("list").style.transform = "translateX(" + dx + "px)";
      }
    }

    function onSwipePointerUp(e) {
      if (!swipeState.active || (e.pointerId != null && e.pointerId !== swipeState.pointerId)) return;
      var dx = swipeState.dx;
      var dy = swipeState.dy;
      var decided = swipeState.decided;
      swipeState.active = false;
      swipeState.pointerId = null;
      var list = $("list");
      list.classList.remove("is-swiping");
      var isPageSwipe = decided === "h" && Math.abs(dx) >= SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy);
      if (decided === "h") {
        swipeState.suppressClick = true;
        clearTimeout(swipeState.suppressTimer);
        swipeState.suppressTimer = setTimeout(function () { swipeState.suppressClick = false; }, 350);
      }
      if (isPageSwipe) {
        var max = pageCount(filteredItems().length);
        if (dx < 0 && state.page < max) {
          animatePageChange(1);
          return;
        }
        if (dx > 0 && state.page > 1) {
          animatePageChange(-1);
          return;
        }
      }
      if (decided === "h") {
        list.classList.add("is-animating");
        list.style.transform = "translateX(0)";
        clearTimeout(swipeTimer);
        swipeTimer = setTimeout(function () {
          list.classList.remove("is-animating");
          list.style.transform = "";
        }, 200);
      } else {
        list.style.transform = "";
      }
    }

    function setupSwipe() {
      var list = $("list");
      list.addEventListener("pointerdown", onSwipePointerDown);
      list.addEventListener("pointermove", onSwipePointerMove, { passive: false });
      list.addEventListener("pointerup", onSwipePointerUp);
      list.addEventListener("pointercancel", onSwipePointerUp);
    }

    function syncSegs() {
      Array.prototype.forEach.call($("statusSeg").querySelectorAll("button"), function (btn) {
        btn.setAttribute("aria-pressed", btn.getAttribute("data-status") === state.formStatus ? "true" : "false");
      });
      Array.prototype.forEach.call($("michSeg").querySelectorAll("button"), function (btn) {
        btn.setAttribute("aria-pressed", btn.getAttribute("data-michelin") === state.formMichelin ? "true" : "false");
      });
      Array.prototype.forEach.call($("rateSeg").querySelectorAll("button"), function (btn) {
        btn.setAttribute("aria-pressed", String(btn.getAttribute("data-rating")) === String(state.formRating) ? "true" : "false");
      });
    }

    function buildSegs() {
      $("michSeg").innerHTML = MICHELIN.map(function (v) {
        return '<button type="button" data-michelin="' + escapeHtml(v) + '">' + escapeHtml(MICHELIN_LABELS[v] || v) + "</button>";
      }).join("");
      var html = '<button type="button" data-rating="0">未評</button>';
      for (var i = 1; i <= 5; i++) html += '<button type="button" data-rating="' + i + '">' + i + "★</button>";
      $("rateSeg").innerHTML = html;
    }

    function upsertItem(data) {
      var idx = -1;
      for (var i = 0; i < state.items.length; i++) {
        if (state.items[i].id === data.id) { idx = i; break; }
      }
      if (idx >= 0) state.items[idx] = data;
      else state.items.push(data);
      saveItems(state.items);
      refreshFilterOptions();
      render();
      refreshOpenDetail();
    }

    function deleteItem(id) {
      state.items = state.items.filter(function (r) { return r.id !== id; });
      saveItems(state.items);
      refreshFilterOptions();
      render();
      if (state.detailId === id) closeDetail();
    }

    function exportJson() {
      var payload = {
        app: "food-hunter",
        version: DATA_VERSION,
        seedVersion: SEED_VERSION,
        exportedAt: new Date().toISOString(),
        restaurants: state.items
      };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "food-hunter-backup.json";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(a.href);
        a.remove();
      }, 500);
      toast("已匯出 " + state.items.length + " 家餐廳");
    }

    function importJsonText(text) {
      var data = JSON.parse(text);
      var packed = unpackStore(data) || (data && Array.isArray(data.restaurants) ? unpackStore(data) : null);
      var rows = packed ? packed.items : (Array.isArray(data) ? data : null);
      if (!Array.isArray(rows)) throw new Error("格式不對");
      var items = rows.map(normalizeItem).filter(function (r) { return r.name; });
      if (!packed || packed.seedVersion < SEED_VERSION) items = mergeSeedUpdates(items);
      state.items = items;
      saveItems(state.items);
      refreshFilterOptions();
      render();
      toast("已匯入 " + items.length + " 家餐廳");

    function hasCoords(r) {
      return !!(r && r.lat != null && r.lng != null && isFinite(r.lat) && isFinite(r.lng));
    }

    function isNearbyCandidate(r) {
      if (!r) return false;
      if (r.revisit === true) return true;
      if (r.status === "去過") return false;
      return r.status === "想去" || r.status === "推薦";
    }

    function haversineKm(lat1, lng1, lat2, lng2) {
      var R = 6371;
      var toRad = Math.PI / 180;
      var dLat = (lat2 - lat1) * toRad;
      var dLng = (lng2 - lng1) * toRad;
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
    }

    function formatDistance(km) {
      if (km == null || !isFinite(km)) return "";
      if (km < 10) return (Math.round(km * 10) / 10).toFixed(1) + " km";
      return Math.round(km) + " km";
    }

    function shuffleCopy(list) {
      var a = (list || []).slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i];
        a[i] = a[j];
        a[j] = tmp;
      }
      return a;
    }

    function pickDiverse(pool, count, avoidIds) {
      count = count || 5;
      var avoid = {};
      (avoidIds || []).forEach(function (id) { avoid[id] = true; });
      function select(preferNew) {
        var picked = [];
        var usedCuisine = {};
        var usedId = {};
        function consider(allowRepeatCuisine) {
          (pool || []).forEach(function (r) {
            if (picked.length >= count) return;
            if (!r || usedId[r.id]) return;
            if (preferNew && avoid[r.id]) return;
            var cui = r.cuisine || "其他";
            if (!allowRepeatCuisine && usedCuisine[cui]) return;
            picked.push(r);
            usedId[r.id] = true;
            usedCuisine[cui] = true;
          });
        }
        consider(false);
        consider(true);
        return picked;
      }
      var picked = select(true);
      if (picked.length < Math.min(count, (pool || []).length)) picked = select(false);
      return picked;
    }

    function recommendNearby(items, origin, opts) {
      opts = opts || {};
      var count = opts.count || 5;
      var windowSize = opts.windowSize || 15;
      var avoid = opts.avoid || [];
      var candidates = (items || []).filter(isNearbyCandidate);
      if (origin && isFinite(origin.lat) && isFinite(origin.lng)) {
        var withDist = candidates.filter(hasCoords).map(function (r) {
          var copy = Object.assign({}, r);
          copy.distanceKm = haversineKm(origin.lat, origin.lng, r.lat, r.lng);
          return copy;
        });
        withDist.sort(function (a, b) { return a.distanceKm - b.distanceKm; });
        var pool = withDist.slice(0, Math.max(windowSize, count));
        return pickDiverse(pool, count, avoid);
      }
      return pickDiverse(shuffleCopy(candidates), count, avoid);
    }

    function nearbyCardHtml(r) {
      var badge = r.status === "去過" ? "been" : (r.status === "推薦" ? "rec" : "want");
      var mich = "";
      if (r.michelin && r.michelin !== "無") {
        var cls = r.michelin === "必比登" ? "bib" : "star";
        mich = '<span class="badge ' + cls + '">' + escapeHtml(r.michelin) + "</span>";
      }
      var dist = r.distanceKm != null
        ? '<span class="nearby-dist">' + escapeHtml(formatDistance(r.distanceKm)) + "</span>"
        : "";
      var bits = [];
      if (r.cuisine) bits.push(r.cuisine);
      if (r.area) bits.push(r.area);
      return (
        '<article class="card" data-id="' + escapeHtml(r.id) + '" tabindex="0" role="button">' +
          coverHtml(coverForItem(r), gRatingBadgeHtml(r) + dist) +
          '<button type="button" class="card-maps" data-maps="1" aria-label="開 Google Maps" onclick="event.stopPropagation()">📍</button>' +
          '<div class="card-body">' +
          '<div class="card-top">' +
            "<h2>" + escapeHtml(r.name) + "</h2>" +
            '<div class="card-badges">' +
              mich +
              revisitBadgeHtml(r) +
              '<span class="badge ' + badge + '">' + escapeHtml(r.status) + "</span>" +
            "</div>" +
          "</div>" +
          '<div class="meta">' + (bits.length ? "<span>" + escapeHtml(bits.join(" · ")) + "</span>" : "") + "</div>" +
          "</div>" +
        "</article>"
      );
    }

    function renderNearbyList(picks) {
      var list = $("nearbyList");
      if (!list) return;
      if (!picks || !picks.length) {
        list.innerHTML = '<p class="nearby-empty">目前沒有可推薦的餐廳</p>';
        return;
      }
      list.innerHTML = picks.map(nearbyCardHtml).join("");
    }

    function drawNearby(resetAvoid) {
      if (resetAvoid) state.nearbyAvoid = [];
      var origin = state.nearbyFallback ? null : state.nearbyOrigin;
      var picks = recommendNearby(state.items, origin, {
        count: 5,
        windowSize: 15,
        avoid: state.nearbyAvoid
      });
      state.nearbyPicks = picks.map(function (r) { return r.id; });
      state.nearbyAvoid = (state.nearbyAvoid || []).concat(state.nearbyPicks);
      renderNearbyList(picks);
      var reroll = $("btnNearbyReroll");
      if (reroll) reroll.disabled = picks.length === 0;
      if ($("nearbyNote")) $("nearbyNote").hidden = !state.nearbyFallback;
    }

    function requestPosition(cb) {
      if (!navigator.geolocation || typeof navigator.geolocation.getCurrentPosition !== "function") {
        cb(null, true);
        return;
      }
      try {
        navigator.geolocation.getCurrentPosition(
          function (pos) {
            var lat = pos && pos.coords && Number(pos.coords.latitude);
            var lng = pos && pos.coords && Number(pos.coords.longitude);
            if (!isFinite(lat) || !isFinite(lng)) { cb(null, true); return; }
            cb({ lat: lat, lng: lng }, false);
          },
          function () { cb(null, true); },
          { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }
        );
      } catch (err) {
        cb(null, true);
      }
    }

    function openNearby() {
      var sheet = $("nearbySheet");
      if (!sheet) return;
      state.nearbyFallback = false;
      state.nearbyOrigin = null;
      state.nearbyPicks = [];
      state.nearbyAvoid = [];
      if ($("nearbyNote")) {
        $("nearbyNote").hidden = true;
        $("nearbyNote").textContent = "無法取得位置，改為隨機混搭";
      }
      renderNearbyList([]);
      $("nearbyList").innerHTML = '<p class="nearby-loading">定位中…</p>';
      if ($("btnNearbyReroll")) $("btnNearbyReroll").disabled = true;
      sheet.hidden = false;
      document.body.classList.add("nearby-open");
      requestPosition(function (origin, fallback) {
        if ($("nearbySheet") && $("nearbySheet").hidden) return;
        state.nearbyOrigin = origin;
        state.nearbyFallback = !!fallback || !origin;
        if (state.nearbyFallback && $("nearbyNote")) {
          $("nearbyNote").hidden = false;
          $("nearbyNote").textContent = "無法取得位置，改為隨機混搭";
        }
        drawNearby(true);
      });
    }

    function closeNearby() {
      var sheet = $("nearbySheet");
      if (sheet) sheet.hidden = true;
      document.body.classList.remove("nearby-open");
    }

    /* events */
    $("btnHome").addEventListener("click", function (e) {
      e.preventDefault();
      goHome();

      e.preventDefault();
      goHome();
    });
    $("fCuisine").addEventListener("input", refreshFormCover);

    $("filterArea").addEventListener("change", onFilterChange);
    $("filterCuisine").addEventListener("change", onFilterChange);
    $("filterStatus").addEventListener("change", onFilterChange);
    $("filterMichelin").addEventListener("change", onFilterChange);
    $("filterBudget").addEventListener("input", onFilterChange);
    $("sortBy").addEventListener("change", onFilterChange);
    $("filterRevisit").addEventListener("change", onFilterChange);
    $("pager").addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-page]");
      if (!btn || btn.disabled) return;
      var list = filteredItems();
      var max = pageCount(list.length);
      var dest = btn.getAttribute("data-page");
      var next = dest === "prev" ? state.page - 1 : dest === "next" ? state.page + 1 : Number(dest);
      if (!isFinite(next) || next < 1 || next > max || next === state.page) return;
      goToPage(next, true);
    });
    $("btnOpenMaps").addEventListener("click", function () {
      var id = $("editId").value;
      var item = state.items.filter(function (r) { return r.id === id; })[0];
      if (!item) return;
      var url = mapsUrl(item.name, item.maps);
      if (url) window.open(url, "_blank", "noopener,noreferrer");
    });
    $("btnFormDelete").addEventListener("click", function () {
      var id = $("editId").value;
      var target = state.items.filter(function (r) { return r.id === id; })[0];
      if (!id) return;
      state.pendingDeleteId = id;
      $("confirmMsg").textContent = target ? "「" + target.name + "」會從這支手機的名單移除，匯出備份前刪了就救不回。" : "確定刪除？";
      $("confirmSheet").hidden = false;
    });
    $("btnAdd").addEventListener("click", function () { openForm(null); });
    $("btnCancel").addEventListener("click", closeForm);
    $("formSheet").addEventListener("click", function (e) {
      if (e.target === $("formSheet")) closeForm();
    });
    $("confirmSheet").addEventListener("click", function (e) {
      if (e.target === $("confirmSheet")) $("confirmSheet").hidden = true;
    });
    $("btnNearby").addEventListener("click", function () { openNearby(); });
    $("btnNearbyReroll").addEventListener("click", function () { drawNearby(false); });
    $("btnNearbyClose").addEventListener("click", closeNearby);
    $("nearbySheet").addEventListener("click", function (e) {
      if (e.target === $("nearbySheet")) closeNearby();
    });
    $("nearbyList").addEventListener("click", function (e) {
      var mapsBtn = e.target.closest(".card-maps");
      if (mapsBtn) {
        e.preventDefault();
        e.stopPropagation();
        var card = mapsBtn.closest(".card");
        var item = card ? findItem(card.getAttribute("data-id")) : null;
        if (!item) return;
        var url = mapsUrl(item.name, item.maps);
        if (url) window.open(url, "_blank", "noopener,noreferrer");
        return;
      }
      var card = e.target.closest(".card");
      if (!card) return;
      var item = findItem(card.getAttribute("data-id"));

    }, true);
    $("btnExport").addEventListener("click", exportJson);
    $("btnImport").addEventListener("click", function () { $("importFile").click(); });
    $("importFile").addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try { importJsonText(String(reader.result || "")); }
        catch (err) { toast("匯入失敗，請確認是本 App 匯出的 JSON"); }
      };
      reader.readAsText(file, "utf-8");
    });
    $("dismissInstall").addEventListener("click", function () {
      localStorage.setItem(HINT_KEY, "1");
      $("installHint").hidden = true;
    });

    $("list").addEventListener("click", function (e) {
      var mapsBtn = e.target.closest(".card-maps");
      if (mapsBtn && $("list").contains(mapsBtn)) {
        e.preventDefault();
        e.stopPropagation();
        if (swipeState.suppressClick) { swipeState.suppressClick = false; return; }
        var mapsCard = mapsBtn.closest(".card");
        var mapsItem = mapsCard ? findItem(mapsCard.getAttribute("data-id")) : null;
        if (mapsItem) window.open(mapsUrl(mapsItem.name, mapsItem.maps), "_blank", "noopener,noreferrer");
      }
    }, true);
    $("list").addEventListener("click", function (e) {
      if (e.target.closest(".card-maps")) return;
      if (swipeState.suppressClick) {
        swipeState.suppressClick = false;
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      var card = e.target.closest(".card");
      if (!card || !$("list").contains(card)) return;
      var item = findItem(card.getAttribute("data-id"));
      if (item) openDetail(item);
    });
    $("list").addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      if (e.target.closest(".card-maps")) return;
      var card = e.target.closest(".card");
      if (!card) return;
      e.preventDefault();
      var item = findItem(card.getAttribute("data-id"));
      if (item) openDetail(item);
    });

    $("btnConfirmNo").addEventListener("click", function () {
      state.pendingDeleteId = null;
      $("confirmSheet").hidden = true;
    });
    $("btnConfirmYes").addEventListener("click", function () {
      if (state.pendingDeleteId) {
        deleteItem(state.pendingDeleteId);
        toast("已刪除");
        closeForm();
      }
      state.pendingDeleteId = null;
      $("confirmSheet").hidden = true;
    });

    $("statusSeg").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-status]");
      if (!btn) return;
      state.formStatus = btn.getAttribute("data-status");
      syncSegs();
    });
    $("michSeg").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-michelin]");
      if (!btn) return;
      state.formMichelin = btn.getAttribute("data-michelin");
      syncSegs();
    });
    $("rateSeg").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-rating]");
      if (!btn) return;
      state.formRating = Number(btn.getAttribute("data-rating")) || 0;
      syncSegs();
    });

    $("restoForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = $("fName").value.trim();
      if (!name) {
        $("formErr").textContent = "請先填店名";
        $("fName").focus();
        return;
      }
      var existing = null;
      var id = $("editId").value;
      if (id) {
        for (var i = 0; i < state.items.length; i++) {
          if (state.items[i].id === id) existing = state.items[i];
        }
      }
      var item = normalizeItem({
        id: id || newId(),
        name: name,
        area: $("fArea").value.trim(),
        cuisine: $("fCuisine").value.trim(),
        dishes: $("fDishes").value.trim(),
        michelin: state.formMichelin,
        priceMin: $("fPriceMin").value,
        priceMax: $("fPriceMax").value,
        status: state.formStatus,
        rating: state.formRating,
        notes: $("fNotes").value.trim(),
        maps: $("fMaps").value.trim(),
        photo: existing ? existing.photo : "",
        revisit: existing ? existing.revisit : false,
        gRating: existing ? existing.gRating : null,
        gCount: existing ? existing.gCount : null,
        gRatingDate: existing ? existing.gRatingDate : "",
        lat: existing ? existing.lat : null,
        lng: existing ? existing.lng : null,
        createdAt: existing ? existing.createdAt : new Date().toISOString()
      });
      upsertItem(item);
      closeForm();
      toast(existing ? "已更新" : "已新增");
    });

    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape") return;
      if (!$("confirmSheet").hidden) {
        $("confirmSheet").hidden = true;
        return;
      }
      if (!$("formSheet").hidden) {
        closeForm();
        return;
      }
      if ($("detailSheet") && !$("detailSheet").hidden) {
        closeDetail();
        return;
      }
      if ($("nearbySheet") && !$("nearbySheet").hidden) closeNearby();
    });

    $("btnDetailMaps").addEventListener("click", function () {
      var item = findItem(state.detailId);
      if (!item) return;
      var url = mapsUrl(item.name, item.maps);
      if (url) window.open(url, "_blank", "noopener,noreferrer");
    });
    $("btnDetailBeen").addEventListener("click", function () { markBeen(); });
    $("btnDetailRevisit").addEventListener("click", function () { toggleRevisit(); });
    $("btnDetailEdit").addEventListener("click", function () {
      var item = findItem(state.detailId);
      if (item) openForm(item);
    });
    $("btnDetailClose").addEventListener("click", function () { closeDetail(); });
    $("detailSheet").addEventListener("click", function (e) {
      if (e.target === $("detailSheet")) closeDetail();
    });
    window.addEventListener("popstate", function () {
      if (state.ignorePop) {
        window.scrollTo(0, 0);
        return;
      }
      if (!state.detailPushed) return;
      state.detailPushed = false;
      if (!$("confirmSheet").hidden) $("confirmSheet").hidden = true;
      if (!$("formSheet").hidden) closeForm();
      closeDetail(true);
    });

    window.FoodHunter = {
      STORAGE_KEY: STORAGE_KEY,
      DATA_VERSION: DATA_VERSION,
      SEED_VERSION: SEED_VERSION,
      SEED: SEED,
      loadItems: loadItems,
      mergeSeedUpdates: mergeSeedUpdates,
      unpackStore: unpackStore,
      mapsUrl: mapsUrl,
      isMapsUrl: isMapsUrl,
      normalizeItem: normalizeItem,
      formatBahtRange: formatBahtRange,
      priceMid: priceMid,
      getState: function () { return state; },
      setItems: function (items) {
        state.items = items.map(normalizeItem);
        saveItems(state.items);
        refreshFilterOptions();
        render();
      },
      render: render,
      filteredItems: filteredItems,
      coverFor: coverFor,
      coverForItem: coverForItem,
      PAGE_SIZE: PAGE_SIZE,
      currentPageSize: currentPageSize,
      layoutCols: layoutCols,
      goToPage: goToPage,
      openDetail: openDetail,
      closeDetail: closeDetail,
      findItem: findItem,
      goHome: goHome,
      mergeGoogleRatings: mergeGoogleRatings,
      parseCoord: parseCoord,
      hasCoords: hasCoords,
      isNearbyCandidate: isNearbyCandidate,
      haversineKm: haversineKm,
      formatDistance: formatDistance,
      pickDiverse: pickDiverse,
      recommendNearby: recommendNearby,
      openNearby: openNearby,
      closeNearby: closeNearby,
      drawNearby: drawNearby
    };

    function onViewportChange() {
      var next = currentPageSize();
      var prev = lastPageSize || next;
      if (next === prev) return;
      var first = (state.page - 1) * prev;
      lastPageSize = next;
      state.page = Math.floor(first / next) + 1;
      render();
    }

    var viewportTimer = null;
    function scheduleViewportChange() {
      clearTimeout(viewportTimer);
      viewportTimer = setTimeout(onViewportChange, 80);
    }

    setupManifest();
    setupLogo();
    buildSegs();
    state.items = loadItems();
    refreshFilterOptions();
    lastPageSize = currentPageSize();
    render();
    setupSwipe();
    maybeShowInstallHint();
    window.addEventListener("resize", scheduleViewportChange);
    window.addEventListener("orientationchange", scheduleViewportChange);
  })();
