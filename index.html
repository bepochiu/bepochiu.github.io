  <style>
    :root {
      --bg: #1a1410;
      --bg-elev: #241c16;
      --card: #2e241c;
      --card-hover: #382c22;
      --line: rgba(244, 213, 141, 0.14);
      --ink: #f6efe4;
      --muted: #b8a894;
      --gold: #e9c46a;
      --gold-dim: #c4a35a;
      --chili: #e85d04;
      --chili-soft: rgba(232, 93, 4, 0.16);
      --teal: #2a9d8f;
      --teal-soft: rgba(42, 157, 143, 0.16);
      --danger: #e76f51;
      --danger-soft: rgba(231, 111, 81, 0.16);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      --radius: 18px;
      --font: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Helvetica Neue", system-ui, sans-serif;
      --display: "Iowan Old Style", "Songti TC", "PMingLiU", "LiSong Pro", "Hiragino Mincho ProN", Georgia, serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.45;
      min-height: 100%;
    }
    body {
      min-height: 100dvh;
      padding-bottom: calc(96px + var(--safe-bot));
    }
    button, input, select, textarea {
      font-family: inherit;
      font-size: 16px;
      color: inherit;
    }
    button { cursor: pointer; }
    a { color: var(--gold); }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: calc(12px + var(--safe-top)) 16px 0;
    }

    header.app-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      min-width: 0;
    }
    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #1a1410 center/cover no-repeat;
      box-shadow: 0 0 0 1px var(--line), var(--shadow);
      flex-shrink: 0;
    }
    .brand h1 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .brand .sub {
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 1px;
    }
    .head-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      min-height: 40px;
    }
    .ghost:active { background: var(--card); color: var(--ink); }

    .hint {
      background: var(--chili-soft);
      border: 1px solid rgba(232, 93, 4, 0.28);
      color: var(--ink);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .hint button {
      margin-left: auto;
      background: none;
      border: 0;
      color: var(--muted);
      padding: 0 4px;
      font-size: 1.1rem;
      line-height: 1;
    }
    .hint[hidden], .install-hint[hidden] { display: none; }

    .search {
      width: 100%;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px 12px 42px;
      outline: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%23b8a894' stroke-width='1.8' stroke-linecap='round'><circle cx='9' cy='9' r='6'/><path d='M13.5 13.5 L17 17'/></svg>");
      background-repeat: no-repeat;
      background-position: 14px 50%;
    }
    .search:focus { border-color: var(--gold-dim); }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0 6px;
    }
    .filters label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .filters select {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 28px 10px 10px;
      min-height: 44px;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' fill='%23b8a894'><path d='M0 0l6 8 6-8z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
    }

    .count {
      color: var(--muted);
      font-size: 0.8rem;
      margin: 8px 2px 12px;
    }

    .list { display: flex; flex-direction: column; gap: 10px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 14px 12px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset;
      display: block;
      text-decoration: none;
      color: inherit;
      position: relative;
    }
    .card:active { background: var(--card-hover); }
    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .card h2 {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 650;
      letter-spacing: 0.01em;
      flex: 1;
      min-width: 0;
    }
    .badge {
      flex-shrink: 0;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 999px;
      padding: 3px 8px;
      letter-spacing: 0.04em;
    }
    .badge.want { background: var(--chili-soft); color: #ffb347; }
    .badge.been { background: var(--teal-soft); color: #7dd3c7; }
    .badge.rec { background: rgba(233, 196, 106, 0.18); color: var(--gold); }
    .meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.82rem;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
    }
    .meta span { white-space: nowrap; }
    .price { color: var(--gold); font-weight: 600; letter-spacing: 0.08em; }
    .stars { color: var(--gold); letter-spacing: 0.04em; }
    .stars .off { opacity: 0.28; }
    .notes {
      margin-top: 8px;
      font-size: 0.86rem;
      color: #e4d7c5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 10px;
    }
    .card-actions button {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      min-height: 36px;
    }
    .card-actions button:active { background: var(--bg-elev); color: var(--ink); }
    .card-actions .del:active { color: var(--danger); border-color: var(--danger); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 48px 12px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }
    .empty strong { color: var(--ink); display: block; margin-bottom: 6px; font-size: 1.05rem; }

    .fab {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: calc(20px + var(--safe-bot));
      background: var(--chili);
      color: #fff8f0;
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
      box-shadow: 0 10px 24px rgba(232, 93, 4, 0.4);
      z-index: 20;
    }
    .fab:active { transform: translateY(1px); }

    .sheet-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 40;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-bg[hidden] { display: none; }
    .sheet {
      background: var(--bg-elev);
      width: 100%;
      max-width: 560px;
      max-height: min(92dvh, 820px);
      overflow: auto;
      border-radius: 24px 24px 0 0;
      padding: 10px 16px calc(20px + var(--safe-bot));
      box-shadow: var(--shadow);
    }
    .grab {
      width: 40px;
      height: 4px;
      border-radius: 4px;
      background: var(--line);
      margin: 4px auto 10px;
    }
    .sheet h3 {
      margin: 0 0 14px;
      font-family: var(--display);
      font-size: 1.25rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .field span {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .field input, .field select, .field textarea {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      outline: none;
      width: 100%;
    }
    .field textarea { min-height: 88px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold-dim);
    }
    .seg, .mich-seg, .rate-seg {
      display: grid;
      gap: 6px;
    }
    .seg { grid-template-columns: 1fr 1fr 1fr; }
    .mich-seg { grid-template-columns: repeat(5, 1fr); }
    .rate-seg { grid-template-columns: 1.15fr repeat(5, 1fr); }
    .seg button, .mich-seg button, .rate-seg button {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 6px;
      min-height: 44px;
      color: var(--muted);
    }
    .mich-seg button, .rate-seg button { padding: 10px 4px; font-size: 0.78rem; }
    .seg button[aria-pressed="true"].want {
      background: var(--chili-soft);
      border-color: var(--chili);
      color: #ffb347;
    }
    .seg button[aria-pressed="true"].been {
      background: var(--teal-soft);
      border-color: var(--teal);
      color: #7dd3c7;
    }
    .seg button[aria-pressed="true"].rec {
      background: rgba(233, 196, 106, 0.16);
      border-color: var(--gold);
      color: var(--gold);
    }
    .mich-seg button[aria-pressed="true"],
    .rate-seg button[aria-pressed="true"] {
      background: rgba(233, 196, 106, 0.16);
      border-color: var(--gold);
      color: var(--gold);
    }
    .range-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
    }
    .range-row .sep { color: var(--muted); }
    .range-row input { min-width: 0; }
    .badge.bib { background: rgba(233, 196, 106, 0.18); color: #e9c46a; }
    .badge.star { background: rgba(232, 93, 4, 0.16); color: #ffb347; }
    .card-badges { display: flex; flex-wrap: wrap; gap: 6px; flex-shrink: 0; justify-content: flex-end; }
    .dishes {
      margin-top: 8px;
      font-size: 0.86rem;
      color: #e4d7c5;
    }
    .dishes .lbl { color: var(--gold-dim); font-size: 0.72rem; letter-spacing: 0.04em; margin-right: 4px; }
    input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      outline: none;
      width: 100%;
      min-height: 44px;
    }
    input[type="number"]:focus { border-color: var(--gold-dim); }
    .budget-field input { margin-top: 4px; }
    .sheet-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .sheet-actions button {
      flex: 1;
      min-height: 48px;
      border-radius: 14px;
      border: 0;
      font-weight: 650;
    }
    .sheet-actions .cancel {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .sheet-actions .save {
      background: var(--chili);
      color: #fff8f0;
    }
    .err { color: var(--danger); font-size: 0.82rem; min-height: 1.2em; margin: 0 0 8px; }

    .confirm {
      text-align: center;
      padding: 8px 8px 4px;
    }
    .confirm p { margin: 0 0 16px; color: var(--ink); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(88px + var(--safe-bot));
      transform: translateX(-50%);
      background: #3a2f24;
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.88rem;
      z-index: 60;
      box-shadow: var(--shadow);
      max-width: calc(100% - 32px);
      text-align: center;
    }
    .toast[hidden] { display: none; }

    @media (min-width: 640px) {
      .sheet-bg { align-items: center; padding: 24px; }
      .sheet { border-radius: 24px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="app-head">
      <div class="brand">
        <div class="logo" id="appLogo" role="img" aria-label="美食獵人"></div>
        <div>
          <h1>美食獵人</h1>
          <div class="sub">曼谷口袋名單</div>
        </div>
      </div>
      <div class="head-actions">
        <button type="button" class="ghost" id="btnExport">匯出</button>
        <button type="button" class="ghost" id="btnImport">匯入</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </header>

    <div class="hint install-hint" id="installHint" hidden>
      <div>用 Safari 或 Chrome 打開後，點「分享／選單」再選「加入主畫面」，就可以當 App 使用，離線也能看名單。</div>
      <button type="button" id="dismissInstall" aria-label="關閉">×</button>
    </div>

    <input class="search" id="search" type="search" placeholder="搜尋店名、區域、料理、推薦菜或筆記" enterkeyhint="search" autocomplete="off">

    <div class="filters">
      <label>區域
        <select id="filterArea"></select>
      </label>
      <label>料理
        <select id="filterCuisine"></select>
      </label>
      <label>狀態
        <select id="filterStatus">
          <option value="">全部狀態</option>
          <option value="想去">想去</option>
          <option value="去過">去過</option>
          <option value="推薦">推薦</option>
        </select>
      </label>
      <label>米其林／必比登
        <select id="filterMichelin">
          <option value="">全部</option>
          <option value="必比登或星級">必比登或星級</option>
          <option value="必比登">必比登</option>
          <option value="米其林一星">米其林一星</option>
          <option value="二星">二星</option>
          <option value="三星">三星</option>
          <option value="無">無</option>
        </select>
      </label>
      <label>排序
        <select id="sortBy">
          <option value="newest">最新</option>
          <option value="rating">評分</option>
          <option value="price">人均</option>
        </select>
      </label>
      <label class="budget-field">人均預算上限（泰銖）
        <input id="filterBudget" type="number" min="0" step="50" inputmode="numeric" placeholder="不限">
      </label>
    </div>

    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
  </div>

  <button type="button" class="fab" id="btnAdd">＋ 新增餐廳</button>
  <div class="toast" id="toast" hidden></div>

  <div class="sheet-bg" id="formSheet" hidden>
    <form class="sheet" id="restoForm" autocomplete="off">
      <div class="grab"></div>
      <h3 id="formTitle">新增餐廳</h3>
      <input type="hidden" id="editId">
      <label class="field">店名
        <input id="fName" name="name" required maxlength="120" placeholder="例如 Krua Apsorn">
      </label>
      <label class="field">區域
        <input id="fArea" name="area" maxlength="80" placeholder="例如 Thonglor" list="areaList">
      </label>
      <datalist id="areaList"></datalist>
      <label class="field">料理類型
        <input id="fCuisine" name="cuisine" maxlength="80" placeholder="例如 南泰料理" list="cuisineList">
      </label>
      <datalist id="cuisineList"></datalist>
      <label class="field">推薦菜
        <textarea id="fDishes" name="dishes" maxlength="400" placeholder="例如 蝦餃、腸粉、流沙包"></textarea>
      </label>
      <div class="field"><span>米其林</span>
        <div class="mich-seg" id="michSeg"></div>
      </div>
      <div class="field"><span>人均（泰銖）</span>
        <div class="range-row">
          <input id="fPriceMin" type="number" min="0" step="10" inputmode="numeric" placeholder="最低">
          <span class="sep">–</span>
          <input id="fPriceMax" type="number" min="0" step="10" inputmode="numeric" placeholder="最高">
        </div>
      </div>
      <div class="field"><span>狀態</span>
        <div class="seg" id="statusSeg">
          <button type="button" class="want" data-status="想去" aria-pressed="true">想去</button>
          <button type="button" class="been" data-status="去過" aria-pressed="false">去過</button>
          <button type="button" class="rec" data-status="推薦" aria-pressed="false">推薦</button>
        </div>
      </div>
      <div class="field"><span>我的評分</span>
        <div class="rate-seg" id="rateSeg"></div>
      </div>
      <label class="field">Google Maps 連結
        <input id="fMaps" name="maps" maxlength="500" placeholder="沒填會自動用店名搜尋曼谷" inputmode="url">
      </label>
      <label class="field">筆記
        <textarea id="fNotes" name="notes" maxlength="800" placeholder="訂位、營業時間、心得…"></textarea>
      </label>
      <p class="err" id="formErr"></p>
      <div class="sheet-actions">
        <button type="button" class="cancel" id="btnCancel">取消</button>
        <button type="submit" class="save">儲存</button>
      </div>
    </form>
  </div>

  <div class="sheet-bg" id="confirmSheet" hidden>
    <div class="sheet confirm" role="dialog" aria-labelledby="confirmTitle">
      <div class="grab"></div>
      <h3 id="confirmTitle">刪除這家餐廳？</h3>
      <p id="confirmMsg"></p>
      <div class="sheet-actions">
        <button type="button" class="cancel" id="btnConfirmNo">取消</button>
        <button type="button" class="save" id="btnConfirmYes" style="background:#c2410c">刪除</button>
      </div>
    </div>
  </div>

      { id: "seed-sane", since: 3, name: "SANE", area: "Taling Chan", cuisine: "泰式", dishes: "", michelin: "必比登", priceMin: null, priceMax: null, status: "推薦", rating: 0, notes: "2027年新入選必比登的家庭式泰菜，位在Taling Chan，指南把它列為適合帶家人、價位中等的泰國菜。", maps: "https://www.google.com/maps/search/?api=1&query=SANE%20219/2%20Bang%20Chueak%20Nang%20Road%20Taling%20Chan%20Bangkok", createdAt: "2026-11-13T02:30:00+07:00" }
    ];

    var state = {
      items: [],
      formMichelin: "無",
      formStatus: "想去",
      formRating: 0,
      pendingDeleteId: null
    };
    var toastTimer = null;

    function $(id) { return document.getElementById(id); }

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
      });
    }

    function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

    function isMapsUrl(link) {
      try {
        var u = new URL(String(link).trim());
        if (u.protocol !== "https:") return false;
        var h = u.hostname;
        if (h === "maps.app.goo.gl" || h === "goo.gl" || h === "maps.google.com") return true;
        if ((h === "www.google.com" || h === "google.com") && u.pathname.indexOf("/maps") === 0) return true;
        return false;
      } catch (e) {
        return false;
      }
    }

    function mapsUrl(name, link) {
      if (isMapsUrl(link)) return String(link).trim();
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent((name || "").trim() + " Bangkok");
    }

    function newId() {
      return "r-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    }

    function parseMoney(v) {
      if (v == null || v === "") return null;
      var n = Number(v);
      if (!isFinite(n) || n < 0) return null;
      return Math.round(n);
    }

    function priceMid(r) {
      var a = r.priceMin, b = r.priceMax;
      if (a != null && b != null) return (a + b) / 2;
      if (a != null) return a;
      if (b != null) return b;
      return null;
    }

    function formatBahtRange(min, max) {
      if (min == null && max == null) return "";
      if (min != null && max != null) {
        if (min === max) return "฿" + min;
        return "฿" + min + "–" + max;
      }
      if (min != null) return "฿" + min + " 起";
      return "最高 ฿" + max;
    }

    function unpackStore(parsed) {
      if (Array.isArray(parsed)) {
        return { items: parsed, seedVersion: 1, legacy: true };
      }
      if (parsed && Array.isArray(parsed.restaurants)) {
        return {
          items: parsed.restaurants,
          seedVersion: Number(parsed.seedVersion) || 1,
          legacy: (Number(parsed.version) || 1) < DATA_VERSION
        };
      }
      return null;
    }

    function mergeSeedUpdates(items, fromSeedVersion) {
      var have = {};
      items.forEach(function (item) { have[item.id] = true; });
      var seedById = {};
      SEED.forEach(function (s) { seedById[s.id] = s; });
      var updated = items.map(function (item) {
        var seed = seedById[item.id];
        if (!seed) return item;
        var patch = {};
        if (!item.dishes && seed.dishes) patch.dishes = seed.dishes;
        if (!item.michelin && seed.michelin) patch.michelin = seed.michelin;
        if (item.priceMin == null && seed.priceMin != null) patch.priceMin = seed.priceMin;
        if (item.priceMax == null && seed.priceMax != null) patch.priceMax = seed.priceMax;
        if (!item.maps && seed.maps) patch.maps = seed.maps;
        if (!item.area && seed.area) patch.area = seed.area;
        if (!item.cuisine && seed.cuisine) patch.cuisine = seed.cuisine;
        if (!Object.keys(patch).length) return item;
        return normalizeItem(Object.assign({}, item, patch));
      });
      SEED.forEach(function (s) {
        var introduced = s.since || 1;
        if (!have[s.id] && introduced > fromSeedVersion) {
          updated.push(normalizeItem(clone(s)));
        }
      });
      return updated;
    }

    function loadItems() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw != null) {
          var packed = unpackStore(JSON.parse(raw));
          if (packed) {
            var items = packed.items.map(normalizeItem);
            if (packed.seedVersion < SEED_VERSION) items = mergeSeedUpdates(items, packed.seedVersion);
            saveItems(items);
            return items;
          }
        }
      } catch (e) {}
      var seeded = SEED.map(function (r) { return normalizeItem(clone(r)); });
      saveItems(seeded);
      return seeded;
    }

    function normalizeItem(r) {
      r = r || {};
      delete r.since;
      var rating = Number(r.rating);
      if (!isFinite(rating) || rating < 0) rating = 0;
      if (rating > 5) rating = 5;
      rating = Math.round(rating);
      var status = (r.status === "去過" || r.status === "推薦") ? r.status : "想去";
      var min = parseMoney(r.priceMin);
      var max = parseMoney(r.priceMax);
      if (min != null && max != null && min > max) {
        var tmp = min; min = max; max = tmp;
      }
      var mich = MICHELIN.indexOf(r.michelin) >= 0 ? r.michelin : "";
      return {
        id: String(r.id || newId()),
        name: String(r.name || "").trim(),
        area: String(r.area || "").trim(),
        cuisine: String(r.cuisine || "").trim(),
        dishes: String(r.dishes || "").trim(),
        michelin: mich,
        priceMin: min,
        priceMax: max,
        status: status,
        rating: rating,
        notes: String(r.notes || "").trim(),
        maps: String(r.maps || "").trim(),
        createdAt: r.createdAt || new Date().toISOString()
      };
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: DATA_VERSION,
        seedVersion: SEED_VERSION,
        restaurants: items
      }));
    }

    function uniqueSorted(values) {
      var seen = {};
      var out = [];
      values.forEach(function (v) {
        var t = String(v || "").trim();
        if (!t || seen[t]) return;
        seen[t] = true;
        out.push(t);
      });
      out.sort(function (a, b) { return a.localeCompare(b, "zh-Hant"); });
      return out;
    }

    function createdMs(r) {
      var t = Date.parse(r && r.createdAt);
      return isFinite(t) ? t : 0;
    }

    function currentFilters() {
      return {
        q: ($("search").value || "").trim().toLowerCase(),
        area: $("filterArea").value,
        cuisine: $("filterCuisine").value,
        status: $("filterStatus").value,
        michelin: $("filterMichelin").value,
        budget: parseMoney($("filterBudget").value),
        sort: $("sortBy").value
      };
    }

    function matchesMichelin(r, want) {
      if (!want) return true;
      if (want === "必比登或星級") return !!STARRED[r.michelin];
      return r.michelin === want;
    }

    function withinBudget(r, budget) {
      if (budget == null) return true;
      if (r.priceMin != null) return r.priceMin <= budget;
      if (r.priceMax != null) return r.priceMax <= budget;
      return true;
    }

    function filteredItems() {
      var f = currentFilters();
      var list = state.items.filter(function (r) {
        if (f.area && r.area !== f.area) return false;
        if (f.cuisine && r.cuisine !== f.cuisine) return false;
        if (f.status && r.status !== f.status) return false;
        if (!matchesMichelin(r, f.michelin)) return false;
        if (!withinBudget(r, f.budget)) return false;
        if (f.q) {
          var hay = [r.name, r.area, r.cuisine, r.dishes, r.notes].join(" ").toLowerCase();
          if (hay.indexOf(f.q) === -1) return false;
        }
        return true;
      });
      if (f.sort === "rating") {
        list.sort(function (a, b) {
          var ar = a.rating || 0, br = b.rating || 0;
          if (ar !== br) return br - ar;
          return createdMs(b) - createdMs(a);
        });
      } else if (f.sort === "price") {
        list.sort(function (a, b) {
          var am = priceMid(a), bm = priceMid(b);
          var ae = am == null, be = bm == null;
          if (ae && be) return createdMs(b) - createdMs(a);
          if (ae) return 1;
          if (be) return -1;
          if (am !== bm) return am - bm;
          return createdMs(b) - createdMs(a);
        });
      } else {
        list.sort(function (a, b) {
          return createdMs(b) - createdMs(a);
        });
      }
      return list;
    }

    function fillSelect(sel, values, allLabel, current) {
      var html = '<option value="">' + escapeHtml(allLabel) + "</option>";
      values.forEach(function (v) {
        html += '<option value="' + escapeHtml(v) + '"' + (v === current ? " selected" : "") + ">" + escapeHtml(v) + "</option>";
      });
      sel.innerHTML = html;
    }

    function refreshFilterOptions() {
      var area = $("filterArea").value;
      var cuisine = $("filterCuisine").value;
      fillSelect($("filterArea"), uniqueSorted(state.items.map(function (r) { return r.area; })), "全部區域", area);
      fillSelect($("filterCuisine"), uniqueSorted(state.items.map(function (r) { return r.cuisine; })), "全部料理", cuisine);
      $("areaList").innerHTML = uniqueSorted(state.items.map(function (r) { return r.area; })).map(function (v) {
        return '<option value="' + escapeHtml(v) + '">';
      }).join("");
      $("cuisineList").innerHTML = uniqueSorted(state.items.map(function (r) { return r.cuisine; })).map(function (v) {
        return '<option value="' + escapeHtml(v) + '">';
      }).join("");
    }

    function starHtml(rating) {
      if (!rating) return "";
      var s = "";
      for (var i = 1; i <= 5; i++) s += '<span class="' + (i <= rating ? "" : "off") + '">★</span>';
      return '<span class="stars" aria-label="評分 ' + rating + ' 分">' + s + "</span>";
    }

    function render() {
      var list = filteredItems();
      var total = state.items.length;
      $("count").textContent = list.length === total
        ? "共 " + total + " 家"
        : "顯示 " + list.length + " / " + total + " 家";

      if (!total) {
        $("list").innerHTML = '<div class="empty"><strong>還沒有任何餐廳</strong>點右下角「新增餐廳」，填店名後就能存進這支手機。也可以先匯入之前備份的 JSON。</div>';
        return;
      }
      if (!list.length) {
        $("list").innerHTML = '<div class="empty"><strong>沒有符合的餐廳</strong>改一下搜尋或篩選條件試試看。</div>';
        return;
      }

      $("list").innerHTML = list.map(function (r) {
        var href = escapeHtml(mapsUrl(r.name, r.maps));
        var badge = r.status === "去過" ? "been" : (r.status === "推薦" ? "rec" : "want");
        var mich = "";
        if (r.michelin && r.michelin !== "無") {
          var cls = r.michelin === "必比登" ? "bib" : "star";
          mich = '<span class="badge ' + cls + '">' + escapeHtml(r.michelin) + "</span>";
        }
        var baht = formatBahtRange(r.priceMin, r.priceMax);
        return (
          '<a class="card" href="' + href + '" target="_blank" rel="noopener noreferrer" data-id="' + escapeHtml(r.id) + '">' +
            '<div class="card-top">' +
              "<h2>" + escapeHtml(r.name) + "</h2>" +
              '<div class="card-badges">' +
                mich +
                '<span class="badge ' + badge + '">' + escapeHtml(r.status) + "</span>" +
              "</div>" +
            "</div>" +
            '<div class="meta">' +
              (r.area ? "<span>" + escapeHtml(r.area) + "</span>" : "") +
              (r.cuisine ? "<span>" + escapeHtml(r.cuisine) + "</span>" : "") +
              (baht ? '<span class="price">' + escapeHtml(baht) + "</span>" : "") +
              starHtml(r.rating) +
            "</div>" +
            (r.dishes ? '<div class="dishes"><span class="lbl">推薦菜</span> ' + escapeHtml(r.dishes) + "</div>" : "") +
            (r.notes ? '<div class="notes">' + escapeHtml(r.notes) + "</div>" : "") +
            '<div class="card-actions">' +
              '<button type="button" data-edit="' + escapeHtml(r.id) + '">編輯</button>' +
              '<button type="button" class="del" data-del="' + escapeHtml(r.id) + '">刪除</button>' +
            "</div>" +
          "</a>"
        );
      }).join("");
    }

    function toast(msg) {
      var el = $("toast");
      el.textContent = msg;
      el.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.hidden = true; }, 2200);
    }

    function openForm(item) {
      $("formTitle").textContent = item ? "編輯餐廳" : "新增餐廳";
      $("editId").value = item ? item.id : "";
      $("fName").value = item ? item.name : "";
      $("fArea").value = item ? item.area : "";
      $("fCuisine").value = item ? item.cuisine : "";
      $("fDishes").value = item ? item.dishes : "";
      $("fPriceMin").value = item && item.priceMin != null ? item.priceMin : "";
      $("fPriceMax").value = item && item.priceMax != null ? item.priceMax : "";
      $("fMaps").value = item ? item.maps : "";
      $("fNotes").value = item ? item.notes : "";
      $("formErr").textContent = "";
      state.formMichelin = item ? (item.michelin || "無") : "無";
      state.formStatus = item ? item.status : "想去";
      state.formRating = item ? item.rating : 0;
      syncSegs();
      $("formSheet").hidden = false;
      setTimeout(function () { $("fName").focus(); }, 50);
    }

    function closeForm() { $("formSheet").hidden = true; }

    function syncSegs() {
      Array.prototype.forEach.call($("statusSeg").querySelectorAll("button"), function (btn) {
        btn.setAttribute("aria-pressed", btn.getAttribute("data-status") === state.formStatus ? "true" : "false");
      });
      Array.prototype.forEach.call($("michSeg").querySelectorAll("button"), function (btn) {
        btn.setAttribute("aria-pressed", btn.getAttribute("data-michelin") === state.formMichelin ? "true" : "false");
      });
      Array.prototype.forEach.call($("rateSeg").querySelectorAll("button"), function (btn) {
        btn.setAttribute("aria-pressed", String(btn.getAttribute("data-rating")) === String(state.formRating) ? "true" : "false");
      });
    }

    function buildSegs() {
      $("michSeg").innerHTML = MICHELIN.map(function (v) {
        return '<button type="button" data-michelin="' + escapeHtml(v) + '">' + escapeHtml(MICHELIN_LABELS[v] || v) + "</button>";
      }).join("");
      var html = '<button type="button" data-rating="0">未評</button>';
      for (var i = 1; i <= 5; i++) html += '<button type="button" data-rating="' + i + '">' + i + "★</button>";
      $("rateSeg").innerHTML = html;
    }

    function upsertItem(data) {
      var idx = -1;
      for (var i = 0; i < state.items.length; i++) {
        if (state.items[i].id === data.id) { idx = i; break; }
      }
      if (idx >= 0) state.items[idx] = data;
      else state.items.push(data);
      saveItems(state.items);
      refreshFilterOptions();
      render();
    }

    function deleteItem(id) {
      state.items = state.items.filter(function (r) { return r.id !== id; });
      saveItems(state.items);
      refreshFilterOptions();
      render();
    }

    function exportJson() {
      var payload = {
        app: "food-hunter",
        version: DATA_VERSION,
        seedVersion: SEED_VERSION,
        exportedAt: new Date().toISOString(),
        restaurants: state.items
      };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "food-hunter-backup.json";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(a.href);
        a.remove();
      }, 500);
      toast("已匯出 " + state.items.length + " 家餐廳");
    }

    function importJsonText(text) {
      var data = JSON.parse(text);
      var packed = unpackStore(data) || (data && Array.isArray(data.restaurants) ? unpackStore(data) : null);
      var rows = packed ? packed.items : (Array.isArray(data) ? data : null);
      if (!Array.isArray(rows)) throw new Error("格式不對");
      var items = rows.map(normalizeItem).filter(function (r) { return r.name; });
      if (!packed || packed.seedVersion < SEED_VERSION) items = mergeSeedUpdates(items);
      state.items = items;
      saveItems(state.items);
      refreshFilterOptions();
      render();
      toast("已匯入 " + items.length + " 家餐廳");
    }

    function setupManifest() {
      var manifest = {
        name: "Food Hunter 曼谷美食獵人",
        short_name: "美食獵人",
        description: "Bepo 的曼谷口袋美食名單",
        start_url: ".",
        scope: ".",
        display: "standalone",
        orientation: "portrait",
        background_color: "#1a1410",
        theme_color: "#1a1410",
        lang: "zh-Hant",
        icons: [
          { src: "data:image/png;base64," + ICON192, sizes: "192x192", type: "image/png", purpose: "any" },
          { src: "data:image/png;base64," + ICON512, sizes: "512x512", type: "image/png", purpose: "any" }
        ]
      };
      var blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      var link = document.createElement("link");
      link.rel = "manifest";
      link.href = URL.createObjectURL(blob);
      document.head.appendChild(link);
    }

    function setupLogo() {
      $("appLogo").style.backgroundImage = "url(data:image/png;base64," + ICON192 + ")";
    }

    function maybeShowInstallHint() {
      var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
      if (standalone) return;
      if (localStorage.getItem(HINT_KEY) === "1") return;
      $("installHint").hidden = false;
    }

    /* events */
    $("search").addEventListener("input", render);
    $("filterArea").addEventListener("change", render);
    $("filterCuisine").addEventListener("change", render);
    $("filterStatus").addEventListener("change", render);
    $("filterMichelin").addEventListener("change", render);
    $("filterBudget").addEventListener("input", render);
    $("sortBy").addEventListener("change", render);
    $("btnAdd").addEventListener("click", function () { openForm(null); });
    $("btnCancel").addEventListener("click", closeForm);
    $("formSheet").addEventListener("click", function (e) {
      if (e.target === $("formSheet")) closeForm();
    });
    $("confirmSheet").addEventListener("click", function (e) {
      if (e.target === $("confirmSheet")) $("confirmSheet").hidden = true;
    });
    $("btnExport").addEventListener("click", exportJson);
    $("btnImport").addEventListener("click", function () { $("importFile").click(); });
    $("importFile").addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try { importJsonText(String(reader.result || "")); }
        catch (err) { toast("匯入失敗，請確認是本 App 匯出的 JSON"); }
      };
      reader.readAsText(file, "utf-8");
    });
    $("dismissInstall").addEventListener("click", function () {
      localStorage.setItem(HINT_KEY, "1");
      $("installHint").hidden = true;
    });

    $("list").addEventListener("click", function (e) {
      var edit = e.target.closest("[data-edit]");
      var del = e.target.closest("[data-del]");
      if (edit) {
        e.preventDefault();
        e.stopPropagation();
        var item = state.items.filter(function (r) { return r.id === edit.getAttribute("data-edit"); })[0];
        if (item) openForm(item);
        return;
      }
      if (del) {
        e.preventDefault();
        e.stopPropagation();
        var id = del.getAttribute("data-del");
        var target = state.items.filter(function (r) { return r.id === id; })[0];
        state.pendingDeleteId = id;
        $("confirmMsg").textContent = target ? "「" + target.name + "」會從這支手機的名單移除，匯出備份前刪了就救不回。" : "確定刪除？";
        $("confirmSheet").hidden = false;
      }
    });

    $("btnConfirmNo").addEventListener("click", function () {
      state.pendingDeleteId = null;
      $("confirmSheet").hidden = true;
    });
    $("btnConfirmYes").addEventListener("click", function () {
      if (state.pendingDeleteId) {
        deleteItem(state.pendingDeleteId);
        toast("已刪除");
      }
      state.pendingDeleteId = null;
      $("confirmSheet").hidden = true;
    });

    $("statusSeg").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-status]");
      if (!btn) return;
      state.formStatus = btn.getAttribute("data-status");
      syncSegs();
    });
    $("michSeg").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-michelin]");
      if (!btn) return;
      state.formMichelin = btn.getAttribute("data-michelin");
      syncSegs();
    });
    $("rateSeg").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-rating]");
      if (!btn) return;
      state.formRating = Number(btn.getAttribute("data-rating")) || 0;
      syncSegs();
    });

    $("restoForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = $("fName").value.trim();
      if (!name) {
        $("formErr").textContent = "請先填店名";
        $("fName").focus();
        return;
      }
      var existing = null;
      var id = $("editId").value;
      if (id) {
        for (var i = 0; i < state.items.length; i++) {
          if (state.items[i].id === id) existing = state.items[i];
        }
      }
      var item = normalizeItem({
        id: id || newId(),
        name: name,
        area: $("fArea").value.trim(),
        cuisine: $("fCuisine").value.trim(),
        dishes: $("fDishes").value.trim(),
        michelin: state.formMichelin,
        priceMin: $("fPriceMin").value,
        priceMax: $("fPriceMax").value,
        status: state.formStatus,
        rating: state.formRating,
        notes: $("fNotes").value.trim(),
        maps: $("fMaps").value.trim(),
        createdAt: existing ? existing.createdAt : new Date().toISOString()
      });
      upsertItem(item);
      closeForm();
      toast(existing ? "已更新" : "已新增");
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        closeForm();
        $("confirmSheet").hidden = true;
      }
    });

    window.FoodHunter = {
      STORAGE_KEY: STORAGE_KEY,
      DATA_VERSION: DATA_VERSION,
      SEED_VERSION: SEED_VERSION,
      SEED: SEED,
      loadItems: loadItems,
      mergeSeedUpdates: mergeSeedUpdates,
      unpackStore: unpackStore,
      mapsUrl: mapsUrl,
      isMapsUrl: isMapsUrl,
      normalizeItem: normalizeItem,
      formatBahtRange: formatBahtRange,
      priceMid: priceMid,
      getState: function () { return state; },
      setItems: function (items) {
        state.items = items.map(normalizeItem);
        saveItems(state.items);
        refreshFilterOptions();
        render();
      },
      render: render,
      filteredItems: filteredItems
    };

    setupManifest();
    setupLogo();
    buildSegs();
    state.items = loadItems();
    refreshFilterOptions();
    render();
    maybeShowInstallHint();
  })();
  </script>
</body>
</html>
